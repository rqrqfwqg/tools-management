# ============================================
# 工器具管理系统 - 域名版 Nginx 配置
# 用途：域名访问 + HTTPS（Let's Encrypt）
# 使用前：将 YOUR_DOMAIN.com 替换为你的实际域名
# ============================================

# ---------- HTTP → HTTPS 跳转 ----------
server {
    listen 80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

    # Let's Encrypt 证书验证（必须保留，续期要用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主服务 ----------
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

    # Let's Encrypt 证书（certbot 自动生成）
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.com/privkey.pem;

    # SSL 安全优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS（强制浏览器后续走 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 日志
    access_log /var/log/nginx/tools-access.log;
    error_log  /var/log/nginx/tools-error.log;

    # 文件上传大小限制（图片上传）
    client_max_body_size 20M;

    # ---------- 上传文件（图片） ----------
    location /uploads/ {
        alias /opt/tools-management/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- API 代理到后端 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ---------- 移动端前端 ----------
    location /m/ {
        alias /opt/tools-management/mobile-frontend/dist/;
        try_files $uri $uri/ /m/index.html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 移动端 index.html 不缓存（确保更新后立即生效）
    location = /m/index.html {
        alias /opt/tools-management/mobile-frontend/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- PC 端前端（根路径） ----------
    location / {
        root /opt/tools-management/vue-frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # PC 端 index.html 不缓存
    location = /index.html {
        root /opt/tools-management/vue-frontend/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
