# ============================================
# 工器具管理系统 - Nginx 生产配置
# 用途：统一入口，反代 API，托管前端静态文件
# 当前模式：纯 HTTP（域名备案通过后切换 HTTPS）
# ============================================

# ---------- HTTP 主服务 ----------
server {
    listen 80;
    server_name _;

    # 日志
    access_log /var/log/nginx/tools-access.log;
    error_log  /var/log/nginx/tools-error.log;

    # 文件上传大小限制
    client_max_body_size 20M;

    # ---------- 上传文件（图片） ----------
    location /uploads/ {
        alias /opt/tools-management/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- API 代理到后端（小程序网关 3300，生产单实例以保 db.json 写安全） ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ---------- 移动端前端 ----------
    location /m/ {
        alias /opt/tools-management/mobile-frontend/dist/;
        try_files $uri $uri/ /m/index.html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 移动端 index.html 不缓存（确保更新后立即生效）
    location = /m/index.html {
        alias /opt/tools-management/mobile-frontend/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- PC 端前端（根路径） ----------
    location / {
        root /opt/tools-management/vue-frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # PC 端 index.html 不缓存
    location = /index.html {
        root /opt/tools-management/vue-frontend/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

